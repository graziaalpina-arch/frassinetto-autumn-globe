<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frassinetto - Autumn Globe</title>
<style>
body{margin:0;font-family:system-ui;background:#1a120b;color:#fff;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;padding:14px;z-index:10}
h1{margin:0;font-size:22px}
p{margin:4px 0 0;opacity:.85}
canvas{width:100vw;height:100vh;display:block}
.panel{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;color:#222;border-radius:18px;padding:14px}
.panel h2{margin:0;font-size:18px}
.panel p{margin:4px 0 0;font-size:14px}
button{border:0;border-radius:999px;padding:9px 13px;background:#f3e8d8;font-weight:700;margin:8px 4px 0 0}
button.active{background:#d97706;color:#fff}
</style>
</head>
<body>
<header><h1>🍂 Frassinetto - Autumn Globe</h1><p>Ruota il globo, tocca i bottoni</p></header>
<canvas id="scene"></canvas>
<div class="panel"><h2 id="title">Benvenuti a Frassinetto</h2><p id="text">Un piccolo borgo tra le montagne, dove l'autunno dipinge tutto di oro.</p>
<div>
<button class="active" onclick="show(0,this)">🏔️ Borgo</button>
<button onclick="show(1,this)">🍁 Bosco</button>
<button onclick="show(2,this)">⛪ Chiesa</button>
<button onclick="show(3,this)">🥾 Sentieri</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var places=[
["🏔️ Frassinetto","Borgo alpino in Piemonte. Case in pietra, aria pulita e vista sulle montagne."],
["🍁 Bosco d'autunno","Faggi e larici diventano oro, arancione e rosso. Perfetto per passeggiare."],
["⛪ Chiesa del paese","Il cuore del borgo. Qui si incontrano le persone e si respira la storia."],
["🥾 Sentieri","Sentieri per tutti: facili passeggiate e camminate verso le cime."]];
function show(i,b){
document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
document.getElementById('title').textContent=places[i][0];
document.getElementById('text').textContent=places[i][1];
}
var canvas=document.getElementById('scene');
var scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a120b);
var camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100); camera.position.z=4.2;
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true}); renderer.setSize(innerWidth,innerHeight);
var group=new THREE.Group(); scene.add(group);
var globe=new THREE.Mesh(new THREE.SphereGeometry(1.5,64,64),new THREE.MeshStandardMaterial({color:0xd97706,roughness:.7}));
group.add(globe);
var colors=[0xf59e0b,0xef4444,0xfacc15,0x92400e,0xfb923c];
for(var i=0;i<200;i++){
var s=new THREE.Mesh(new THREE.SphereGeometry(.03,6,6),new THREE.MeshStandardMaterial({color:colors[i%5]}));
var a=Math.random()*Math.PI*2, b2=Math.acos(2*Math.random()-1), r=1.55;
s.position.set(r*Math.sin(b2)*Math.cos(a),r*Math.cos(b2),r*Math.sin(b2)*Math.sin(a)); group.add(s);
}
scene.add(new THREE.AmbientLight(0xffffff,.9));
var light=new THREE.DirectionalLight(0xffffff,1); light.position.set(3,2,4); scene.add(light);
var dragging=false,px=0,py=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
canvas.addEventListener('pointermove',e=>{if(!dragging)return; group.rotation.y+=(e.clientX-px)*.005; group.rotation.x+=(e.clientY-py)*.005; px=e.clientX;py=e.clientY;});
canvas.addEventListener('pointerup',()=>dragging=false);
function animate(){requestAnimationFrame(animate); if(!dragging) group.rotation.y+=.003; renderer.render(scene,camera);} animate();
</script>
</body>
</html>
