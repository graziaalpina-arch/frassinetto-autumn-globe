<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frassinetto - Autumn Globe</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#1a120b;color:#fff;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;padding:14px;text-align:center;z-index:20;text-shadow:0 2px 10px #000}
h1{margin:0;font-size:24px}
p{margin:4px 0 0;opacity:.9}
.hero{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.hero img{width:min(92vw,520px);height:auto;border-radius:20px;box-shadow:0 20px 60px #000a}
.leaf{position:fixed;top:-30px;z-index:10;font-size:22px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.panel{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;color:#222;border-radius:18px;padding:14px;z-index:30}
.panel h2{margin:0;font-size:18px}
.panel p{margin:4px 0 0;font-size:14px}
.panel img{width:100%;height:130px;object-fit:cover;border-radius:12px;margin-top:10px;display:none}
.panel img.show{display:block}
button{border:0;border-radius:999px;padding:9px 13px;background:#f3e8d8;font-weight:700;margin:8px 4px 0 0}
button.active{background:#d97706;color:#fff}
</style>
</head>
<body>
<header><h1>🍂 Frassinetto - Autumn Globe</h1><p>Il borgo dentro un globo di vetro</p></header>
<div class="hero"><img src="IMG_0241.jpeg" alt="Frassinetto nel globo"></div>
<div class="panel"><h2 id="title">Benvenuti a Frassinetto</h2><p id="text">Un piccolo borgo tra le montagne, dove l'autunno dipinge tutto di oro.</p>
<img id="photo" src="IMG_0242.jpeg" alt="Frassinetto autunno">
<div>
<button class="active" onclick="show(0,this)">🏔️ Borgo</button>
<button onclick="show(1,this)">🍁 Bosco</button>
<button onclick="show(2,this)">⛪ Chiesa</button>
<button onclick="show(3,this)">🥾 Sentieri</button>
</div></div>
<script>
var places=[
["🏔️ Frassinetto","Borgo alpino in Piemonte. Case in pietra, aria pulita e vista sulle montagne."],
["🍁 Bosco d'autunno","Faggi e larici diventano oro, arancione e rosso. Perfetto per passeggiare."],
["⛪ Chiesa del paese","Il cuore del borgo. Qui si incontrano le persone e si respira la storia."],
["🥾 Sentieri","Sentieri per tutti: facili passeggiate e camminate verso le cime."]];
function show(i,b){
document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
document.getElementById('title').textContent=places[i][0];
document.getElementById('text').textContent=places[i][1];
document.getElementById('photo').classList.add('show');
}
var emojis=['🍂','🍁','🍃','🧡'];
for(var i=0;i<18;i++){var s=document.createElement('div');s.className='leaf';s.textContent=emojis[i%4];s.style.left=(Math.random()*100)+'vw';s.style.animationDuration=(4+Math.random()*4)+'s';s.style.animationDelay=(Math.random()*4)+'s';document.body.appendChild(s);}
</script>
</body>
</html>
